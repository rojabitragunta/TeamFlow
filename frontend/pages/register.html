<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account · TeamFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("tf_theme") || "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="tf-auth-wrap">
    <div class="tf-auth-card">
      <div class="tf-auth-logo">
        <span class="tf-logo-mark">TF</span>
        <span>TeamFlow</span>
      </div>
      <h1>Create your account</h1>
      <p class="tf-auth-sub">The first account created becomes the workspace Admin.</p>

      <div class="alert alert-danger d-none" id="registerError" role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="regName">Full name</label>
          <input type="text" class="form-control" id="regName" placeholder="Roja Bitragunta" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="regEmail">Email address</label>
          <input type="email" class="form-control" id="regEmail" placeholder="you@company.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="regPassword">Password</label>
          <input type="password" class="form-control" id="regPassword" placeholder="At least 6 characters" required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="regConfirmPassword">Confirm password</label>
          <input type="password" class="form-control" id="regConfirmPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100" id="registerSubmitBtn">Create Account</button>
      </form>

      <p class="text-center mt-4 mb-0" style="font-size:0.86rem;color:var(--tf-text-muted);">
        Already have an account? <a href="login.html" style="color:var(--tf-primary); font-weight:600;">Sign in</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
